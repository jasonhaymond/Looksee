# Optional systemd drop-in for the Looksee agent on Linux. Apply only if you
# need SMART drive health or file checks under /home (see agent/README.md →
# Privileges):
#   sudo install -D -m 644 looksee-agent-privileged.conf \
#     /etc/systemd/system/looksee-agent.service.d/privileged.conf
#   sudo systemctl daemon-reload && sudo systemctl restart looksee-agent
[Service]
# smartctl needs raw disk I/O (SATA/SAS) and admin ioctls (NVMe), plus read
# access to the device nodes.
SupplementaryGroups=disk
AmbientCapabilities=CAP_SYS_RAWIO CAP_SYS_ADMIN
CapabilityBoundingSet=CAP_SYS_RAWIO CAP_SYS_ADMIN
# Let file/folder checks see /home (still read-only).
ProtectHome=read-only
