# Copy to looksee-agent.yaml (gitignored, holds a real credential) and fill
# in the values from the engine's Endpoints page (create the endpoint, then use its
# Agent tab — the key is shown once and can't be retrieved again).
engine_url: "https://looksee.example.com"
agent_key: "REPLACE_WITH_HOST_AGENT_KEY"
interval_seconds: 30

# Optional. Folder of approved scripts that "Custom script" checks may run,
# by file name only. Leave unset to disable script checks on this host.
# script_dir: /etc/looksee-agent/scripts

# Optional. NTP server the clock-offset metric compares against.
# ntp_server: pool.ntp.org

# Optional. Docker Engine API socket (default /var/run/docker.sock, or
# npipe:////./pipe/docker_engine on Windows).
# docker_socket: /var/run/docker.sock

# Optional. HTTP(S) proxy for the agent's own traffic to the engine (reports,
# config polls, updates, watchdog webhooks) on networks where web traffic must
# go through one. The agent runs as a system account, which doesn't use the
# proxy set up for signed-in users. Checks still connect directly.
# proxy_url: http://proxy.example.com:8080

# Optional. DNS server (an IP address, optionally :port) for every lookup the
# agent makes. Only needed on Android (Termux) when the agent can't find one
# by itself, or on a machine with no /etc/resolv.conf. See README → Android.
# dns_server: 192.168.1.1
